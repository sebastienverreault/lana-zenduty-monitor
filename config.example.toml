[monitor]
lana_bank_dir = "~/source/repos/lana-bank"
state_dir = "~/.local/state/lana-zenduty-monitor"
poll_interval_seconds = 300
codex_timeout_seconds = 600
gh_timeout_seconds = 120
triage_new_incidents = true
auto_acknowledge = true
auto_resolve_false_positive = false
auto_fix_bug_possible = true
drua_shadow_enabled = true
auto_drua_debug_bug_possible = true
triage_max_attempts = 2
fix_max_attempts = 3
fix_root_dir = "~/.local/state/lana-zenduty-monitor/fixes"
dependabot_repo = "GaloyMoney/lana-bank"
dependabot_pr_limit = 50
concourse_url = "https://ci.galoy.io"
concourse_failure_limit = 20

# Optional Zenduty team for schedule and incident queries. Leave empty to use
# Drua's configured default team.
zenduty_team_id = ""

# Only this Zenduty schedule is authoritative for on-call gating.
# Empty string evaluates all returned schedules.
zenduty_schedule_name = "Primary Schedule"

# Filter incidents by Zenduty assigned_to. Omit this to read from .env.
# Empty list disables assignee filtering.
# assignee_user_id = ["zenduty-user-id-1", "zenduty-user-id-2"]
#
# Optional aliases for display. Omit this to read from .env.
# [monitor.assignee_aliases]
# "zenduty-user-id-1" = "person@example.com"

[codex]
command = "codex"
model = ""
sandbox = "danger-full-access"

# Extra args are appended before the prompt.
extra_args = []
